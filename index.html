<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dlim TV – Series y telenovelas 2000-2014</title>
    <meta name="description" content="Dlim TV: catálogo de series y telenovelas de Televisa de 2000 a 2014." />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
    (function () {
      try { if (localStorage.getItem('dlim:safe') === '1') document.documentElement.classList.add('safe') } catch (e) {}
      function show(m) {
        var d = document.getElementById('dlim-err');
        if (!d) {
          d = document.createElement('div'); d.id = 'dlim-err';
          d.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;background:#7a0019;color:#fff;font:12px/1.4 monospace;padding:8px 10px;white-space:pre-wrap;word-break:break-word';
          d.onclick = function () { d.remove() }; document.body.appendChild(d);
        }
        d.textContent = 'ERROR (toca para cerrar):\n' + m;
      }
      window.addEventListener('error', function (e) { show((e.message || '') + '\n' + ((e.error && e.error.stack) ? e.error.stack.split('\n').slice(0, 9).join('\n') : (e.filename || '') + ':' + (e.lineno || ''))) });
      window.addEventListener('unhandledrejection', function (e) { show('Promesa: ' + ((e.reason && e.reason.message) || e.reason)) });
    })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
