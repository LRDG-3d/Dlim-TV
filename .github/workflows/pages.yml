name: Panel (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Evitar caché del navegador
        run: |
          sed -i "s#admin.js?v=[A-Za-z0-9]*#admin.js?v=${GITHUB_SHA}#" docs/admin/index.html
          sed -i "s#firebase-config.js[^']*'#firebase-config.js?v=${GITHUB_SHA}'#" docs/admin/admin.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: d
        uses: actions/deploy-pages@v4
