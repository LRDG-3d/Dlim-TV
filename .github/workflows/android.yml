name: Android APK
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión (ejemplo: v1.0.0). Déjalo vacío para usar "latest"'
        required: false
        default: ''
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - name: Código nativo (márgenes negros y descargas con notificación)
        run: |
          cp native/*.java android/app/src/main/java/com/lrdg/dlimtv/
          python3 native/patch_manifest.py
      - name: Generar iconos (si hay assets/icon-only.png)
        if: hashFiles('assets/icon-only.png') != ''
        run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Dlim-TV.apk
      - name: Definir versión
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Dlim-TV-apk
          path: Dlim-TV.apk
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Dlim TV ${{ steps.v.outputs.tag }}
          files: Dlim-TV.apk
