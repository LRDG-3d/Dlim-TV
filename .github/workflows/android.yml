name: Android APK
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión (ejemplo: v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - name: Generar iconos (si hay assets/icon-only.png)
        if: hashFiles('assets/icon-only.png') != ''
        run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Dlim-TV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Dlim-TV-apk
          path: Dlim-TV.apk
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Dlim TV ${{ github.event.inputs.version || github.ref_name }}
          files: Dlim-TV.apk
