name: Android APK
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Dependencias
        run: npm install   # cambia a "npm ci" cuando subas package-lock.json
      - name: Plataforma Android
        run: |
          [ -d android ] || npm run android:init
          node scripts/patch-android.mjs
      - name: Iconos y splash
        run: npm run assets
      - name: Build web y sync
        run: npm run build && npx cap sync android
      - name: APK debug
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: app-debug, path: android/app/build/outputs/apk/debug/*.apk }
      - name: APK release firmado
        if: github.ref == 'refs/heads/main' && env.HAS_KEY == 'true'
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
          cd android && ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        if: hashFiles('android/app/build/outputs/apk/release/*.apk') != ''
        with: { name: app-release, path: android/app/build/outputs/apk/release/*.apk }
